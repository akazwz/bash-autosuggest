[package]
name = "bash-autosuggest"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Native GNU Readline history autosuggestions and real-time syntax highlighting for Bash via a loadable builtin"

[lib]
name = "bash_autosuggest"
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

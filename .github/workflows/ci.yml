name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build, Lint & E2E (Ubuntu 22.04 / glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --all-targets

      - name: Unit tests
        run: cargo test

      - name: Build release shared library
        run: cargo build --release

      - name: Live Bash PTY E2E tests
        run: python3 tests/pty_e2e.py target/release/libbash_autosuggest.so

      - name: Upload built .so for cross-distro E2E matrix
        uses: actions/upload-artifact@v4
        with:
          name: bash_autosuggest-linux-x86_64
          path: target/release/libbash_autosuggest.so

  compat-matrix:
    name: Cross-distro E2E (${{ matrix.image }})
    needs: check
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Ubuntu 22.04-built .so
        uses: actions/download-artifact@v4
        with:
          name: bash_autosuggest-linux-x86_64
          path: dist

      - name: Ensure Python 3 is available
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends python3
          fi

      - name: Run PTY E2E tests against native distro /bin/bash
        run: |
          bash --version | head -n 1
          python3 tests/pty_e2e.py dist/libbash_autosuggest.so

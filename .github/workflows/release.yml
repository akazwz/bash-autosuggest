name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} (Debian 13 / rust:1.100.0-trixie)
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:1.100.0-trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Ensure rustfmt, clippy, and python3 are available
        run: |
          rustup component add rustfmt clippy
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends python3
          fi

      - name: Run checks, release build, and E2E tests
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets
          cargo test
          cargo build --release
          python3 tests/pty_e2e.py target/release/libbash_autosuggest.so

      - name: Package raw .so and .deb
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0~${GITHUB_REF_NAME}.${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p dist
          cp target/release/libbash_autosuggest.so "dist/bash_autosuggest-linux-${{ matrix.arch }}.so"

          PKG_DIR="pkg/bash-autosuggest_${VERSION}_${{ matrix.deb_arch }}"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/lib/bash"
          install -m 755 target/release/libbash_autosuggest.so "${PKG_DIR}/usr/lib/bash/bash_autosuggest.so"
          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: bash-autosuggest
          Version: ${VERSION}
          Section: shells
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: bash (>= 5.0), libc6 (>= 2.34)
          Maintainer: akazwz <50396286+akazwz@users.noreply.github.com>
          Description: Native GNU Readline history autosuggestions for Bash
           Zero-lag inline history autosuggestions implemented in Rust as a
           Bash loadable builtin (.so) hooking GNU Readline directly.
           Enable in ~/.bashrc:
             enable -f /usr/lib/bash/bash_autosuggest.so bash_autosuggest && bash_autosuggest
          EOF
          dpkg-deb --build --root-owner-group "${PKG_DIR}" "dist/bash-autosuggest_${VERSION}_${{ matrix.deb_arch }}.deb"

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum bash_autosuggest-linux-*.so bash-autosuggest_*.deb > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" width="780" height="296" role="img" aria-label="bash-autosuggest terminal demo showing inline grey history suggestions, Alt+Right partial word accept, and Right Arrow full accept">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14.5px;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        fill: #8b949e;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 600;
      }
      .prompt-user { fill: #3fb950; font-weight: 600; }
      .prompt-sep  { fill: #8b949e; }
      .prompt-dir  { fill: #58a6ff; font-weight: 600; }
      .cmd         { fill: #e6edf3; }
      .ghost       { fill: #6e7681; }
      .cursor      { fill: #58a6ff; }
      .dim         { fill: #8b949e; }
      .ok          { fill: #3fb950; }
      .hash        { fill: #d29922; }
      .ref         { fill: #a371f7; }

      .frame { opacity: 0; }
      .f0 { animation: show0 4.8s steps(1, end) infinite; }
      .f1 { animation: show1 4.8s steps(1, end) infinite; }
      .f2 { animation: show2 4.8s steps(1, end) infinite; }
      .f3 { animation: show3 4.8s steps(1, end) infinite; }
      .f4 { animation: show4 4.8s steps(1, end) infinite; }
      .f5 { animation: show5 4.8s steps(1, end) infinite; }
      .f6 { animation: show6 4.8s steps(1, end) infinite; }
      .f7 { animation: show7 4.8s steps(1, end) infinite; }

      @keyframes show0 { 0% { opacity: 1; } 6% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes show1 { 0% { opacity: 0; } 6% { opacity: 1; } 8.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes show2 { 0% { opacity: 0; } 8.5% { opacity: 1; } 11% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes show3 { 0% { opacity: 0; } 11% { opacity: 1; } 13.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes show4 { 0% { opacity: 0; } 13.5% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes show5 { 0% { opacity: 0; } 27% { opacity: 1; } 43% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes show6 { 0% { opacity: 0; } 43% { opacity: 1; } 57% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes show7 { 0% { opacity: 0; } 57% { opacity: 1; } 100% { opacity: 1; } }

      .blink { animation: cursor-blink 1s steps(1, end) infinite; }
      @keyframes cursor-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
    </style>
  </defs>

  <!-- Terminal Window -->
  <rect x="1" y="1" width="778" height="294" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M1 12 A11 11 0 0 1 12 1 H768 A11 11 0 0 1 779 12 V38 H1 Z" fill="url(#titlebar)"/>
  <line x1="1" y1="38" x2="779" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="22" cy="19.5" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="19.5" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="19.5" r="5.5" fill="#27c93f"/>
  <text x="390" y="24" text-anchor="middle" class="title">bash — native GNU Readline · bash-autosuggest</text>

  <!-- Static Status Line -->
  <text x="22" y="68" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cmd">bash_autosuggest status</tspan></text>
  <text x="22" y="92" class="mono" xml:space="preserve"><tspan class="dim">bash_autosuggest: </tspan><tspan class="ok">enabled</tspan><tspan class="dim"> (style="38;5;242", history_entries=10240)</tspan></text>

  <!-- Frame 0: Empty prompt -->
  <g class="frame f0">
    <text x="22" y="128" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cursor blink">▌</tspan></text>
    <rect x="612" y="252" width="146" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="685" y="268" text-anchor="middle" class="badge-text" fill="#8b949e">Ready in Bash</text>
  </g>

  <!-- Frame 1: 'g' + ghost -->
  <g class="frame f1">
    <text x="22" y="128" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cmd">g</tspan><tspan class="cursor">▌</tspan><tspan class="ghost">it log --oneline -n 3</tspan></text>
    <rect x="536" y="252" width="222" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="647" y="268" text-anchor="middle" class="badge-text" fill="#8b949e">Instant ghost text (~0.1 ms)</text>
  </g>

  <!-- Frame 2: 'gi' + ghost -->
  <g class="frame f2">
    <text x="22" y="128" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cmd">gi</tspan><tspan class="cursor">▌</tspan><tspan class="ghost">t log --oneline -n 3</tspan></text>
    <rect x="536" y="252" width="222" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="647" y="268" text-anchor="middle" class="badge-text" fill="#8b949e">Instant ghost text (~0.1 ms)</text>
  </g>

  <!-- Frame 3: 'git' + ghost -->
  <g class="frame f3">
    <text x="22" y="128" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cmd">git</tspan><tspan class="cursor">▌</tspan><tspan class="ghost"> log --oneline -n 3</tspan></text>
    <rect x="536" y="252" width="222" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="647" y="268" text-anchor="middle" class="badge-text" fill="#8b949e">Instant ghost text (~0.1 ms)</text>
  </g>

  <!-- Frame 4: 'git ' + ghost -->
  <g class="frame f4">
    <text x="22" y="128" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cmd">git </tspan><tspan class="cursor">▌</tspan><tspan class="ghost">log --oneline -n 3</tspan></text>
    <rect x="536" y="252" width="222" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="647" y="268" text-anchor="middle" class="badge-text" fill="#8b949e">Matched from Bash history</text>
  </g>

  <!-- Frame 5: Alt+Right accepts one word ('log') -->
  <g class="frame f5">
    <text x="22" y="128" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cmd">git log</tspan><tspan class="cursor">▌</tspan><tspan class="ghost"> --oneline -n 3</tspan></text>
    <rect x="526" y="252" width="232" height="24" rx="6" fill="#1f2937" stroke="#58a6ff"/>
    <text x="642" y="268" text-anchor="middle" class="badge-text" fill="#79c0ff">Alt + →  accept next word</text>
  </g>

  <!-- Frame 6: Right Arrow accepts full remaining suggestion -->
  <g class="frame f6">
    <text x="22" y="128" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cmd">git log --oneline -n 3</tspan><tspan class="cursor">▌</tspan></text>
    <rect x="530" y="252" width="228" height="24" rx="6" fill="#132a1e" stroke="#3fb950"/>
    <text x="644" y="268" text-anchor="middle" class="badge-text" fill="#56d364">→ / End  accept full line</text>
  </g>

  <!-- Frame 7: Enter executes cleanly -->
  <g class="frame f7">
    <text x="22" y="128" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cmd">git log --oneline -n 3</tspan></text>
    <text x="22" y="156" class="mono" xml:space="preserve"><tspan class="hash">3a90794</tspan><tspan class="ref"> (HEAD -&gt; main, tag: v0.1.1)</tspan><tspan class="cmd"> fix: UTF-8 width &amp; vi mode</tspan></text>
    <text x="22" y="180" class="mono" xml:space="preserve"><tspan class="hash">223917b</tspan><tspan class="dim"> (tag: v0.1.0)</tspan><tspan class="cmd"> feat: native Readline autosuggestions</tspan></text>
    <text x="22" y="204" class="mono" xml:space="preserve"><tspan class="hash">323d603</tspan><tspan class="cmd"> feat: initial Rust loadable builtin for Bash</tspan></text>
    <text x="22" y="236" class="mono" xml:space="preserve"><tspan class="prompt-user">dev@linux</tspan><tspan class="prompt-sep">:</tspan><tspan class="prompt-dir">~/repo</tspan><tspan class="prompt-sep">$ </tspan><tspan class="cursor blink">▌</tspan></text>
    <rect x="598" y="252" width="160" height="24" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="678" y="268" text-anchor="middle" class="badge-text" fill="#8b949e">Enter · clean run</text>
  </g>

  <!-- Subtle bottom-left footer hint -->
  <text x="22" y="268" class="badge-text" fill="#484f58">0 external crates · ~350 KB .so · 100% native Bash</text>
</svg>
